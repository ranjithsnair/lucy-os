# Limine boot menu/config (see limine/ for the vendored bootloader
# itself, and kernel/limine.c for the kernel-side request/response
# glue). timeout: 0 boots the one entry below instantly, no menu -
# matching how the old hand-written BIOS boot loader never showed one
# either.
timeout: 0

/poc-os
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/fs.img
